# إعدادات Streamlit للمنصة (تُقرأ تلقائياً عند التشغيل من مجلد المشروع)
[theme]
# قاعدة داكنة ثابتة: تصاميم المنصة مبنية عليها، فلا يتغيّر شكل القوائم والجداول والشريط السفلي بتغيّر نمط نظام التشغيل
base = "dark"

[client]
# شريط أدوات مبسّط (بلا زر Deploy وقوائم المطوّر) للمستخدم النهائي
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
